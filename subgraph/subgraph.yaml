specVersion: 1.0.0
description: Postage — stamps, settlements and verified-human attestations on Arc
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PostageEscrow
    network: arc-testnet
    source:
      address: "0x164f432fd08dd4611172aa077882859b7c3ead7f"
      abi: PostageEscrow
      startBlock: 60568030
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/escrow.ts
      entities:
        - Sender
        - Inbox
        - Stamp
      abis:
        - name: PostageEscrow
          file: ./abis/PostageEscrow.json
      eventHandlers:
        - event: PriceSet(indexed address,uint256)
          handler: handlePriceSet
        - event: StampPosted(indexed bytes32,indexed address,indexed address,uint256)
          handler: handleStampPosted
        - event: StampReleased(indexed bytes32,indexed address,uint256)
          handler: handleStampReleased
        - event: StampClaimed(indexed bytes32,indexed address,uint256,uint256)
          handler: handleStampClaimed
        - event: StampExpired(indexed bytes32,indexed address,uint256)
          handler: handleStampExpired
  - kind: ethereum
    name: HumanRegistry
    network: arc-testnet
    source:
      address: "0x1b83c30c4138ca29a942f1a14237881daa7320d9"
      abi: HumanRegistry
      startBlock: 60568030
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/registry.ts
      entities:
        - HumanAttestation
        - Sender
      abis:
        - name: HumanRegistry
          file: ./abis/HumanRegistry.json
      eventHandlers:
        - event: HumanAttested(indexed address,indexed bytes32,uint40)
          handler: handleHumanAttested
  - kind: ethereum
    name: PostageVault
    network: arc-testnet
    source:
      address: "0x771f3da6d0d05f904fd28a782bfafdf18393aa90"
      abi: PostageVault
      startBlock: 60568030
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/vault.ts
      entities:
        - Vault
      abis:
        - name: PostageVault
          file: ./abis/PostageVault.json
      eventHandlers:
        - event: Funded(uint256,uint256,uint256)
          handler: handleFunded
        - event: RelayerRefilled(uint256)
          handler: handleRelayerRefilled
        - event: TreasuryWithdrawn(indexed address,uint256)
          handler: handleTreasuryWithdrawn
