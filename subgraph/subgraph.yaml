specVersion: 1.0.0
description: Postage — stamps, settlements and verified-human attestations on Arc
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PostageEscrow
    network: arc-testnet
    source:
      address: "0xa17f3d284ce462e049c54b98aee55b7739b06c16"
      abi: PostageEscrow
      startBlock: 60558189
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/escrow.ts
      entities:
        - Sender
        - Inbox
        - Stamp
      abis:
        - name: PostageEscrow
          file: ./abis/PostageEscrow.json
      eventHandlers:
        - event: PriceSet(indexed address,uint256)
          handler: handlePriceSet
        - event: StampPosted(indexed bytes32,indexed address,indexed address,uint256)
          handler: handleStampPosted
        - event: StampReleased(indexed bytes32,indexed address,uint256)
          handler: handleStampReleased
        - event: StampClaimed(indexed bytes32,indexed address,uint256)
          handler: handleStampClaimed
        - event: StampExpired(indexed bytes32,indexed address,uint256)
          handler: handleStampExpired
  - kind: ethereum
    name: HumanRegistry
    network: arc-testnet
    source:
      address: "0xfcdca9fbd11dd826e459eddccf8f0581de77ab46"
      abi: HumanRegistry
      startBlock: 60558189
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/registry.ts
      entities:
        - HumanAttestation
        - Sender
      abis:
        - name: HumanRegistry
          file: ./abis/HumanRegistry.json
      eventHandlers:
        - event: HumanAttested(indexed address,indexed bytes32,uint40)
          handler: handleHumanAttested
