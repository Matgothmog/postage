specVersion: 1.0.0
description: Postage — what mail costs, who paid, and which code priced it
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PostageEscrow
    network: arc-testnet
    source:
      address: "0x4469e869433cf6cc08dd54afc6ac7e288b9a38f7"
      abi: PostageEscrow
      startBlock: 60744660
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/escrow.ts
      entities: [Sender, Inbox, Payment]
      abis:
        - name: PostageEscrow
          file: ./abis/PostageEscrow.json
      eventHandlers:
        - event: FloorPriceSet(indexed address,uint256)
          handler: handleFloorPriceSet
        - event: Paid(indexed bytes32,indexed address,indexed address,uint8,uint256,uint256)
          handler: handlePaid
        - event: SpamReported(indexed bytes32,indexed address,indexed address)
          handler: handleSpamReported
        - event: EarningsClaimed(indexed address,indexed address,uint256)
          handler: handleEarningsClaimed
  - kind: ethereum
    name: EnclaveRegistry
    network: arc-testnet
    source:
      address: "0xf6afced17443571c79036f9d543ddbc2c5a645f9"
      abi: EnclaveRegistry
      startBlock: 60731753
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/enclave.ts
      entities: [Enclave, ExpectedMeasurement]
      abis:
        - name: EnclaveRegistry
          file: ./abis/EnclaveRegistry.json
      eventHandlers:
        - event: MeasurementSet(bytes32)
          handler: handleMeasurementSet
        - event: EnclaveRegistered(indexed address,bytes32)
          handler: handleEnclaveRegistered
        - event: EnclaveRevoked(indexed address)
          handler: handleEnclaveRevoked
  - kind: ethereum
    name: HumanRegistry
    network: arc-testnet
    source:
      address: "0x0f9a1c7e971df81adc1b0335a527b30b6f136d05"
      abi: HumanRegistry
      startBlock: 60731753
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/registry.ts
      entities: [HumanAttestation, Sender]
      abis:
        - name: HumanRegistry
          file: ./abis/HumanRegistry.json
      eventHandlers:
        - event: HumanAttested(indexed address,indexed bytes32,uint40)
          handler: handleHumanAttested
  - kind: ethereum
    name: PostageVault
    network: arc-testnet
    source:
      address: "0xd488a385529e9eec44a17b686f3b9372071f22dc"
      abi: PostageVault
      startBlock: 60731753
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/vault.ts
      entities: [Vault]
      abis:
        - name: PostageVault
          file: ./abis/PostageVault.json
      eventHandlers:
        - event: Funded(uint256,uint256,uint256)
          handler: handleFunded
        - event: RelayerRefilled(uint256)
          handler: handleRelayerRefilled
        - event: TreasuryWithdrawn(indexed address,uint256)
          handler: handleTreasuryWithdrawn
