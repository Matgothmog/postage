"""
A wallet that has paid to reach an inbox. This is the reputation record the
pricing engine reads back: what a sender has sent, and how often the recipient
disagreed with the classifier afterwards.
"""
type Sender @entity(immutable: false) {
  id: Bytes!
  paidCount: Int!
  totalPaid: BigInt!
  spamReports: Int!
  """
  spamReports / paidCount. Only meaningful once something has been paid, so it
  reads as zero rather than as trustworthy for a sender with no history.
  """
  spamRate: BigDecimal!
  firstSeenAt: BigInt!
  humanUntil: BigInt
  payments: [Payment!]! @derivedFrom(field: "sender")
}

"""An inbox, what it charges, and what it has earned."""
type Inbox @entity(immutable: false) {
  id: Bytes!
  floorPrice: BigInt!
  receivedCount: Int!
  earned: BigInt!
  claimed: BigInt!
  payments: [Payment!]! @derivedFrom(field: "inbox")
}

"""
One message paid for. The tier is the classifier's verdict, which is what the
enclave signed and the escrow refused to price without.
"""
type Payment @entity(immutable: false) {
  id: Bytes!
  sender: Sender!
  inbox: Inbox!
  tier: Tier!
  amount: BigInt!
  toVault: BigInt!
  paidAt: BigInt!
  tx: Bytes!
  reportedAsSpam: Boolean!
}

enum Tier {
  Human
  Important
  Commercial
  Dangerous
}

"""
A signing key the protocol accepts prices from, and the image measurement it
was allowed under. Anyone can recompute that measurement from source.
"""
type Enclave @entity(immutable: false) {
  id: Bytes!
  measurement: Bytes!
  registeredAt: BigInt!
  revoked: Boolean!
}

"""A World ID result, recorded on Arc."""
type HumanAttestation @entity(immutable: false) {
  id: Bytes!
  wallet: Bytes!
  nullifierHash: Bytes!
  expiresAt: BigInt!
  attestedAt: BigInt!
  renewals: Int!
}

"""
Where the protocol's share goes. One row, id "vault", so a single query answers
how much paid mail has funded free verification.
"""
type Vault @entity(immutable: false) {
  id: Bytes!
  totalFunded: BigInt!
  toTreasury: BigInt!
  toSponsorship: BigInt!
  refilledToRelayer: BigInt!
  withdrawnByTreasury: BigInt!
  fundingEvents: Int!
}
