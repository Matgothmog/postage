[package]
name = "postage-mail-worker"
description = "Cloudflare Worker (workers-rs) for inbound mail handling"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
mail-parser = "0.11.9"
postage-core = { workspace = true }
postage-shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = "2"
worker = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = ["AbortSignal", "Blob", "BlobPropertyBag", "FormData"] }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
