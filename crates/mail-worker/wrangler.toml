# Config for the production mail worker, `postage-mail`, which runs the Rust
# build; it replaced the TypeScript worker in place under the same name and
# keeps its KV namespace and binding names. To roll back to the last TypeScript
# version, run `wrangler rollback 73edd33b-700a-4cd8-80a5-c32c8126e49a`.
# Secrets are never written here. Set them with:
#   wrangler secret put POSTAGE_API_URL
#   wrangler secret put POSTAGE_SECRET
#   wrangler secret put MAILGUN_API_KEY
name = "postage-mail"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[build]
command = "cargo install -q worker-build && worker-build --release"

[vars]
# api.eu.mailgun.net for a domain created in the EU region.
MAILGUN_API_BASE = "https://api.mailgun.net"

# Mailgun will show MX records for this domain. DO NOT ADD THEM: usepostage.com's
# MX is what points inbound mail at the worker, and repointing it stops every
# message reaching Postage at all. Only the SPF and DKIM records are needed, and
# the SPF one has to be merged into the record already there rather than added
# beside it - two SPF records are worse than none.
MAILGUN_DOMAIN = "usepostage.com"

# Held mail, and the only copy of it. Values carry an expiry set when they are
# written, so a hold nobody answers is dropped by Cloudflare at its deadline.
# The same namespace the TypeScript worker used, so mail held before the
# switch to the Rust build is still released.
[[kv_namespaces]]
binding = "HELD"
id = "332d86ab54b3480492e8241c0e18b9cf"
